name: Build standalone downloader
on:
  push:
    branches: [codex/standalone-torrent-downloader]
    paths: ['torrent-downloader/**', '.github/workflows/downloader.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standalone-downloader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test, build and lint standalone app
        run: gradle -p torrent-downloader :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android launch and real local torrent transfer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: sh torrent-downloader/verify-device.sh
      - name: Prepare separate APK
        run: |
          mkdir -p downloader-out
          cp torrent-downloader/app/build/outputs/apk/debug/app-debug.apk downloader-out/IAMTT-Downloader.apk
          unzip -l downloader-out/IAMTT-Downloader.apk | grep 'lib/arm64-v8a/.*\.so'
          sha256sum downloader-out/IAMTT-Downloader.apk > downloader-out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: IAMTT-Downloader-${{ github.run_number }}
          path: downloader-out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Downloader-test-reports-${{ github.run_number }}
          path: |
            torrent-downloader/app/build/reports/
            torrent-downloader/app/build/test-results/
