name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            # Surface compiler errors as annotations so they're readable from the Actions summary.
            grep -E '^e: |error:|What went wrong' -A3 build.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/IAMTT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IAMTT-apk-${{ github.run_number }}
          path: out/IAMTT.apk

      - name: Publish "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/IAMTT.apk \
            --title "IAMTT build ${{ github.run_number }}" \
            --notes "Latest build from main (${GITHUB_SHA::7}). Install IAMTT.apk on your Google TV." \
            --latest
