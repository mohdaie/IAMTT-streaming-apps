name: Check IAMTT Web
on:
  push:
    branches: [main, codex/iamtt-web-app]
    paths: ['web-app/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web-app/**', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
